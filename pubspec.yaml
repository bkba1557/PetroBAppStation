name: nnexoris_customer
description: PETRO B customer wallet and fueling application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter_riverpod: ^3.4.1
  flutter_stripe: ^12.4.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.3
  go_router: ^17.3.0
  intl: 0.20.2
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.14.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/logo.png
    - assets/branding/app_icon.png
    - assets/branding/saudi_riyal_symbol.svg

flutter_launcher_icons:
  android: false
  ios: true
  image_path_ios: assets/branding/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
