org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Tuned for this workstation (8 logical processors, 16 GB RAM). These make
# repeat builds substantially faster without exhausting system memory.
org.gradle.workers.max=4
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Flutter's ReleaseMinSdkCheck task is not configuration-cache compatible yet.
# Keep Gradle's regular build cache enabled above for safe repeat-build speed.
org.gradle.configuration-cache=false
# Keep the Kotlin compiler warm and reuse outputs between development builds.
# All project, Flutter, and Pub cache paths are currently on the C: drive, so
# incremental cache path relocation is safe on this workstation.
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
